<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cactus Café POS Demo</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo">Cactus Cafe</div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="index.html#about" class="nav-link">About</a></li>
                <li><a href="index.html#menu" class="nav-link">Menu</a></li>
                <li><a href="index.html#featured" class="nav-link">Featured</a></li>
                <li><a href="index.html#gallery" class="nav-link">Gallery</a></li>
                <li><a href="index.html#testimonials" class="nav-link">Reviews</a></li>
                <li><a href="index.html#contact" class="nav-link">Contact</a></li>
                <li><a href="pos.html" class="nav-link active">POS</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- POS Top Bar -->
    <header class="pos-topbar">
        <div class="pos-left">Cactus Cafe</div>
        <div class="pos-center"><input type="text" id="pos-search" placeholder="Search items..." /></div>
        <div class="pos-right">
            <span id="pos-time"></span>
            <button id="stock-mgmt-btn" class="stock-mgmt-btn" title="Manage Inventory">📦 Inventory</button>
            <span class="status-pill">Demo Mode</span>
            <span class="cashier-name">Cashier: Demo</span>
        </div>
    </header>

    <!-- Main POS content container -->
    <main class="pos-main">
        <section class="pos-products">
            <div class="pos-categories" id="pos-categories"></div>
            <div class="products-grid" id="products-grid"></div>
        </section>
        <section class="pos-cart" id="pos-cart"></section>
        <section class="pos-checkout" id="pos-checkout"></section>
    </main>

    <!-- Modal placeholder -->
    <div id="pos-modal" class="pos-modal hidden">
        <div class="pos-modal-content">
            <span class="pos-modal-close">&times;</span>
            <div id="pos-modal-body"></div>
        </div>
    </div>

    <script src="script/pos.js"></script>
</body>
</html>
